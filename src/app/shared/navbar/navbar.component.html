<nav class="sticky top-0 z-50 w-full border-b border-white/10 bg-white/70 backdrop-blur-md dark:bg-black/70 dark:border-white/5">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <!-- Logo -->
      <a routerLink="/" class="text-xl font-bold tracking-tight dark:text-white">
        TECH<span class="text-blue-600">SHOP</span>
      </a>

      <!-- Menu Desktop -->
      <div class="hidden md:flex space-x-8 items-center">
        <a routerLink="/" class="text-sm font-medium hover:text-blue-600 transition-colors dark:text-gray-300">Accueil</a>
        <a routerLink="/products" class="text-sm font-medium hover:text-blue-600 transition-colors dark:text-gray-300">Boutique</a>
        
        <!-- Toggle Dark Mode -->
        <button (click)="toggleTheme()" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors">
          <lucide-icon [name]="isDark ? Sun : Moon" class="w-5 h-5 dark:text-white"></lucide-icon>
        </button>

        <!-- Panier -->
        <a routerLink="/cart" class="relative p-2 group">
          <lucide-icon [name]="ShoppingCart" class="w-6 h-6 dark:text-white group-hover:text-blue-600 transition-colors"></lucide-icon>
          
          <!-- Badge Signal mis à jour -->
          <span *ngIf="totalItems() > 0" 
                class="absolute top-0 right-0 flex h-4 w-4 items-center justify-center rounded-full bg-blue-600 text-[10px] font-bold text-white animate-in zoom-in">
            {{ totalItems() }}
          </span>
        </a>
      </div>

    </div>
  </div>
</nav>
