<div class="container mx-auto p-4 max-w-4xl min-h-[calc(100vh-64px)] flex flex-col justify-center">
  
  <div *ngIf="loading()" class="text-center py-12">
    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-600 mx-auto"></div>
  </div>

  <div *ngIf="!loading() && product()" class="bg-white dark:bg-white/5 border border-gray-200 dark:border-white/5 rounded-2xl overflow-hidden shadow-sm p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
    
    <!-- Image -->
    <div class="bg-gray-50 dark:bg-neutral-900 rounded-xl p-8 flex items-center justify-center">
      <img [src]="product()?.image" [alt]="product()?.title" class="max-h-80 object-contain">
    </div>

    <!-- Infos -->
    <div class="flex flex-col justify-between">
      <div>
        <span class="text-xs uppercase font-bold text-blue-500 tracking-wider">{{ product()?.category }}</span>
        <h2 class="text-xl md:text-2xl font-bold text-gray-900 dark:text-white mt-1 mb-4">{{ product()?.title }}</h2>
        <p class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed mb-6">{{ product()?.description }}</p>
      </div>

      <div class="pt-4 border-t border-gray-100 dark:border-white/5">
        <div class="flex items-center justify-between mb-4">
          <span class="text-2xl font-extrabold text-blue-600 dark:text-blue-400">{{ product()?.price | currency:'MGA':'Ar':'1.2-2':'mg' }}</span>
        </div>
        <div class="flex gap-3">
          <button (click)="addToCart()" class="flex-grow bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition-colors shadow-sm">
            Ajouter au panier
          </button>
          <a routerLink="/products" class="bg-gray-100 dark:bg-white/5 text-gray-800 dark:text-gray-300 font-medium px-4 py-2.5 rounded-lg text-sm transition-colors border border-transparent hover:border-gray-200">
            Retour
          </a>
        </div>
      </div>
    </div>

  </div>
</div>
